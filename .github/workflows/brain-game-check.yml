name: Ani Bran checks

on:
  push:
    paths:
      - "brain-game/**"
      - ".github/workflows/brain-game-check.yml"
  pull_request:
    paths:
      - "brain-game/**"
      - ".github/workflows/brain-game-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check brain-game/app.js
          node --check brain-game/misi-nalar.js
          node --check brain-game/ruang.js
          node --check brain-game/audio.js
          node --check brain-game/sw.js
          node --check brain-game/smoke-test.cjs
      - name: Validate manifest and asset references
        run: |
          node -e "JSON.parse(require('fs').readFileSync('brain-game/manifest.json', 'utf8')); console.log('manifest.json valid')"
          node -e "const fs=require('fs'); const h=fs.readFileSync('brain-game/index.html','utf8'); for(const p of ['./styles.css','./levels.css','./audio.css?v=1','./app.js','./misi-nalar.js','./audio.js?v=1','./manifest.json','./icon.svg','./sw.js']) { if(!h.includes(p)) throw new Error('Missing reference: '+p); } console.log('HTML asset references valid')"
          node -e "const r=fs.readFileSync('brain-game/ruang.html','utf8'); for(const p of ['./styles.css','./ruang.css','./audio.css?v=1','./ruang.js?v=2','./audio.js?v=1']) { if(!r.includes(p)) throw new Error('Missing Ruang asset: '+p); } const j=fs.readFileSync('brain-game/ruang.js','utf8'); for(const p of [\"$('send-review').addEventListener\",\"$('whatsapp-float').addEventListener\",\"$('instagram-float').addEventListener\",'wa.me/','www.instagram.com/']) { if(!j.includes(p)) throw new Error('Missing contact interaction: '+p); } console.log('Ruang contacts, rating interactions, and assets valid')"
          node -e "const h=fs.readFileSync('brain-game/index.html','utf8'); if(h.includes('data-action=\"install\"')||!h.includes('<em>GAMES 🧠</em>')||!h.includes('./ruang.html')) throw new Error('Homepage text/button or secondary-page link invalid'); console.log('Homepage text/button checks passed')"
          node -e "const s=fs.readFileSync('brain-game/app.js','utf8'); const n=(s.match(/id: '(sequence|memory|logic|math|pattern|word|lights|mastermind|sudoku|river|tricky|synapse|misi-nalar)'/g)||[]).length; if(n!==13) throw new Error('Expected 13 games, found '+n); console.log('13 game definitions found')"

      - name: Run runtime and 4,800-level smoke tests
        run: node brain-game/smoke-test.cjs
