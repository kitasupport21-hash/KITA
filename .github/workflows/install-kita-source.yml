name: Install KITA app source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app source
        run: |
          unzip -o KITA-app-ready.zip -d /tmp/kita-app
          cp -R /tmp/kita-app/* .
          rm -rf /tmp/kita-app
          rm -f KITA-app-ready.zip
      - name: Commit app source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Install KITA app source"
          git push
