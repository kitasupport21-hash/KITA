name: BAZY Android APK

on:
  push:
    branches: [bazy-app]
    paths:
      - 'bazy/**'
      - '.github/workflows/bazy-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bazy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bazy/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept required Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Verify Capacitor configuration
        run: |
          test -f capacitor.config.json
          test ! -f capacitor.config.ts
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('capacitor.config.json','utf8')); console.log('Capacitor JSON config OK')"
          npx cap --version
          echo "Config files present:"
          ls -la capacitor.config.*

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./android/gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BAZY-Android-debug
          path: bazy/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
