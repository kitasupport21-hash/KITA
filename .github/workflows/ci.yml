name: NOVA CI

on:
  push:
    branches: [main, nova-preflight]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full verification suite
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
