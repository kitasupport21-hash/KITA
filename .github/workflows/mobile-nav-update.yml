name: Apply mobile navigation update
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mobile UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old='<button className="bell" onClick={()=>notify(\'NOVA Reminder\',lang===\'en\'?\'Notifications are active.\':\'Notifikasi aktif.\')}><Bell/></button>'
          new='<div className="headerActions"><button className="langChip" onClick={()=>setLanguage(lang===\'id\'?\'en\':\'id\')} aria-label="Change language">🌐 {lang===\'id\'?\'EN\':\'ID\'}</button><button className="bell" onClick={()=>notify(\'NOVA Reminder\',lang===\'en\'?\'Notifications are active.\':\'Notifikasi aktif.\')}><Bell/></button></div>'
          if old not in s:
              raise SystemExit('header target not found')
          s=s.replace(old,new,1)
          old_footer='<footer>NOVA Life OS v4 · Offline-ready · Local-first · IDR</footer>'
          new_footer='''<nav className="bottomNav" aria-label="Primary mobile navigation">{[['home','Home',Home],['planner','Planner',ListTodo],['money','Money',Wallet],['goals','Goals',Target],['notes','Notes',Edit3],['focus','Timer',Clock]].map(([id,label,I])=><button key={id as string} className={tab===id?'active':''} onClick={()=>setTab(id as Tab)}><I size={19}/><span>{lang==='en'?label:(id==='home'?'Beranda':id==='planner'?'Planner':id==='money'?'Keuangan':id==='goals'?'Target':id==='notes'?'Catatan':'Timer')}</span></button>)}</nav><footer>NOVA Life OS v4 · Offline-ready · Local-first · IDR</footer>'''
          if old_footer not in s:
              raise SystemExit('footer target not found')
          s=s.replace(old_footer,new_footer,1)
          p.write_text(s)
          c=Path('src/index.css')
          css=c.read_text()
          css=css.replace('header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0a}', 'header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0a}.headerActions{display:flex;align-items:center;gap:8px}.langChip{height:40px;padding:0 11px;border:1px solid #ffffff10;background:#ffffff06;color:#8fe8fa;border-radius:12px;font-size:10px;font-weight:900}.bottomNav{display:none}')
          css=css.replace('@media(max-width:700px){', '@media(max-width:700px){.bottomNav{position:fixed;left:10px;right:10px;bottom:10px;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:7px;border:1px solid #ffffff12;background:rgba(10,17,27,.94);backdrop-filter:blur(18px);border-radius:18px;box-shadow:0 12px 40px #0009}.bottomNav button{min-width:0;border:0;background:transparent;color:#71859c;border-radius:12px;padding:8px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8px;font-weight:800}.bottomNav button.active{color:#07131b;background:#68e1fa}.bottomNav button svg{flex:none}main{padding-bottom:105px}.sideBottom{display:none}')
          css += '\n:root[data-theme="light"] .bottomNav{background:rgba(255,255,255,.94);border-color:#dce5ef;box-shadow:0 12px 40px #8292a333}:root[data-theme="light"] .bottomNav button{color:#6c7d91}:root[data-theme="light"] .bottomNav button.active{color:#07131b}\n'
          c.write_text(css)
          PY
      - name: Verify
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/index.css
          git commit -m "Improve mobile bottom navigation and language access" || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/mobile-nav-update.yml
          git commit -m "Remove temporary mobile UI workflow"
          git push
