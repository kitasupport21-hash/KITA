name: NOVA v4 repair
on:
  push:
    branches: [nova-life-os-v4]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace("'Best streak':'Best streak','Budget bulan ini'", "'Best streak':'Best streak','Budget bulan ini'")
          s=s.replace("'Kebiasaan':'Habits','Catatan':'Notes','Pengaturan':'Settings','Otomasi':'Automations','Insight':'Insights','Halo':'Hello','Mode terang'", "'Kebiasaan':'Habits','Catatan':'Notes','Pengaturan':'Settings','Otomasi':'Automations','Insight':'Insights','Halo':'Hello','Mode terang'")
          p.write_text(s)
          a=Path('src/AuthGate.tsx')
          a.write_text("import App from './App';\nexport default function AuthGate(){return <App/>}\n")
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/AuthGate.tsx
          git diff --cached --quiet || git commit -m "Repair NOVA v4 source and disable legacy auth gate"
          git push
