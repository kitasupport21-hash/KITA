<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KITA - Job App Indonesia</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#17243a}button,input{font:inherit}button{cursor:pointer}.app{max-width:440px;min-height:100vh;margin:auto;background:white;position:relative;padding:18px 16px 85px}.brand{color:#0864ed;font-size:23px;font-weight:800;display:flex;align-items:center;gap:8px}.logo{background:#0864ed;color:white;border-radius:8px 8px 8px 2px;padding:3px 9px;font-size:23px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.search{display:flex;align-items:center;gap:8px;border:1px solid #dce5f1;border-radius:10px;padding:12px;margin-bottom:16px}.search input{border:0;outline:0;width:100%;font-size:12px}.hero{background:linear-gradient(120deg,#0864ed,#368cff);color:white;padding:20px;border-radius:14px;margin-bottom:23px}.hero h3{font-size:17px;line-height:1.5;margin:0}.hero p{font-size:11px;line-height:1.6}h3.section{font-size:15px;margin:20px 0 12px}.sectionrow{display:flex;align-items:center;justify-content:space-between}.link{border:0;background:none;color:#0864ed;font-size:11px}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:17px 6px}.cat{border:0;background:white;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10px;color:#44536b}.cat span{background:#eaf2ff;color:#0864ed;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px}.job{border:1px solid #e7edf5;border-radius:12px;padding:12px;margin:10px 0;display:flex;gap:10px;align-items:flex-start}.company{width:43px;height:43px;border-radius:9px;color:white;font-weight:bold;display:grid;place-items:center;flex-shrink:0}.jbody{flex:1;min-width:0}.jtitle{font-size:12px;font-weight:bold;margin:2px 0 5px}.muted{font-size:10px;color:#8290a4}.meta{font-size:10px;color:#697a91;margin:9px 0}.tag{color:#0864ed;background:#edf5ff;padding:4px 6px;border-radius:5px;font-size:9px}.salary{font-size:11px;font-weight:bold;margin-top:6px}.save{border:0;background:white;color:#0864ed;font-size:18px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:white;border-top:1px solid #e8edf4;display:flex;justify-content:space-around;padding:12px 4px 10px;z-index:5}.bottom button{border:0;background:white;color:#7d8ba0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px}.bottom button.active{color:#0864ed;font-weight:bold}.primary{border:0;background:#0864ed;color:white;border-radius:9px;padding:13px;font-size:13px;font-weight:bold;width:100%;margin-top:12px}.back{border:0;background:white;color:#52627a;padding:8px 0;font-size:13px}.field{display:block;font-size:11px;color:#53627a;margin:15px 0}.field input,.field select,.field textarea{display:block;width:100%;padding:13px;border:1px solid #dce5f1;border-radius:9px;margin-top:7px;background:white}.page-title{font-size:20px;margin:15px 0 8px}.chips{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.chips button{white-space:nowrap;border:1px solid #e0e7f0;background:white;border-radius:20px;padding:8px 12px;font-size:10px}.chips button.active{background:#0864ed;color:white}.profile{display:flex;align-items:center;gap:12px;padding:15px 0 25px}.avatar{background:#e4efff;color:#0864ed;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:20px}.menuitem{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 5px;border:0;border-bottom:1px solid #edf0f5;background:white;text-align:left;font-size:12px;color:#42516a}.empty{text-align:center;padding:45px 10px;color:#8090a5;font-size:12px}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#17243a;color:white;padding:12px 16px;border-radius:9px;font-size:12px;z-index:10;width:max-content;max-width:90%}.hide{display:none!important}
</style>
</head>
<body>
<div class="app"><div id="view"></div></div>
<nav class="bottom">
<button class="active" onclick="go('home',this)">⌂<span>Beranda</span></button><button onclick="go('search',this)">⌕<span>Cari</span></button><button onclick="go('applications',this)">▤<span>Lamaran</span></button><button onclick="go('profile',this)">♙<span>Profil</span></button>
</nav><div id="toast" class="toast hide"></div>
<script>
const jobs=[
{id:1,title:"Software Engineer",company:"Tokopedia",city:"Jakarta Selatan",salary:"Rp 8.000.000 - 15.000.000/bln",type:"Full Time",logo:"T",color:"#078747",category:"IT & Digital",desc:"Bergabunglah dengan tim teknologi kami untuk membangun pengalaman digital terbaik bagi pengguna di Indonesia."},
{id:2,title:"Frontend Developer",company:"Ruanguru",city:"Jakarta Pusat",salary:"Rp 6.000.000 - 12.000.000/bln",type:"Full Time",logo:"R",color:"#10a9b9",category:"IT & Digital",desc:"Membangun antarmuka web yang mudah digunakan dan responsif."},
{id:3,title:"Backend Developer",company:"Gojek",city:"Jakarta Selatan",salary:"Rp 7.000.000 - 14.000.000/bln",type:"Full Time",logo:"G",color:"#079b50",category:"IT & Digital",desc:"Mengembangkan API yang andal dan aman untuk layanan digital."},
{id:4,title:"UI/UX Designer",company:"Shopee",city:"Jakarta Barat",salary:"Rp 5.000.000 - 10.000.000/bln",type:"Full Time",logo:"S",color:"#f45135",category:"Marketing",desc:"Merancang pengalaman produk digital berdasarkan kebutuhan pengguna."},
{id:5,title:"Data Analyst",company:"BCA",city:"Jakarta Pusat",salary:"Rp 6.500.000 - 12.000.000/bln",type:"Full Time",logo:"BCA",color:"#0757b9",category:"Keuangan",desc:"Menganalisis data bisnis dan memberikan insight untuk keputusan."},
{id:6,title:"Digital Marketing",company:"Traveloka",city:"Bandung",salary:"Rp 4.500.000 - 8.000.000/bln",type:"Remote",logo:"T",color:"#2877d5",category:"Marketing",desc:"Mengembangkan kampanye digital dan meningkatkan pertumbuhan brand."}
];
let saved=JSON.parse(localStorage.getItem("kk_saved")||"[]"),applied=JSON.parse(localStorage.getItem("kk_applied")||"[]"),currentJob=null,query="",category="Semua",user=JSON.parse(localStorage.getItem("kk_user")||"null"),page="home";
const $=id=>document.getElementById(id);
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hide");setTimeout(()=>$("toast").classList.add("hide"),2400)}
function brand(){return '<div class="brand"><span class="logo">K</span>KITA</div>'}
function header(){return '<div class="header">'+brand()+'<button class="back" onclick="go(\\'notifications\\')">♧</button></div>'}
function jobCard(j){return '<div class="job" onclick="detail('+j.id+')"><div class="company" style="background:'+j.color+'">'+j.logo+'</div><div class="jbody"><div class="jtitle">'+j.title+'</div><div class="muted">'+j.company+'</div><div class="meta">⌖ '+j.city+'　<span class="tag">'+j.type+'</span></div><div class="salary">'+j.salary+'</div></div><button class="save" onclick="event.stopPropagation();toggleSave('+j.id+')">'+(saved.includes(j.id)?"♥":"♡")+'</button></div>'}
function catButton(name,icon){return '<button class="cat" onclick="category='+JSON.stringify(name)+';go(\\'search\\')"><span>'+icon+'</span>'+name+'</button>'}
function go(p,el){page=p;currentJob=null;document.querySelectorAll(".bottom button").forEach(b=>b.classList.remove("active"));if(el)el.classList.add("active");render()}
function render(){const v=$("view");
if(page==="home"){v.innerHTML=header()+'<div class="search"><span>⌕</span><input placeholder="Cari pekerjaan, posisi, atau perusahaan..." oninput="query=this.value;page=\\'search\\';render()"></div><div class="hero"><h3>Wujudkan Karir Impianmu<br>Bersama KITA</h3><p>Ribuan lowongan kerja dari perusahaan terpercaya di Indonesia.</p></div><div class="sectionrow"><h3 class="section">Kategori</h3><button class="link" onclick="go(\\'search\\')">Lihat Semua</button></div><div class="categories">'+catButton("IT & Digital","▣")+catButton("Marketing","➤")+catButton("Keuangan","▤")+catButton("Pendidikan","♧")+catButton("Kesehatan","♡")+catButton("Teknik","⚙")+catButton("Administrasi","▦")+catButton("Lainnya","•••")+'</div><div class="sectionrow"><h3 class="section">Lowongan Populer</h3><button class="link" onclick="go(\\'search\\')">Lihat Semua</button></div>'+jobs.slice(0,3).map(jobCard).join("");
}else if(page==="search"){let list=jobs.filter(j=>(category==="Semua"||j.category===category||j.type===category)&&(j.title+" "+j.company+" "+j.city).toLowerCase().includes(query.toLowerCase()));v.innerHTML='<button class="back" onclick="go(\\'home\\')">← Kembali</button><h2 class="page-title">Cari Pekerjaan</h2><div class="search"><span>⌕</span><input value="'+query+'" placeholder="Cari posisi atau perusahaan..." oninput="query=this.value;render()"></div><div class="chips">'+["Semua","Full Time","Remote","IT & Digital","Marketing"].map(c=>'<button class="'+(category===c?'active':'')+'" onclick="category='+JSON.stringify(c)+';render()">'+c+'</button>').join("")+'</div><p class="muted">'+list.length+' lowongan ditemukan</p>'+list.map(jobCard).join("")+(list.length?"":'<div class="empty">Tidak ada lowongan yang cocok.</div>');
}else if(page==="detail"&&currentJob){let j=currentJob;v.innerHTML='<button class="back" onclick="go(\\'search\\')">← Kembali</button><div style="text-align:center;padding:18px 0"><div class="company" style="margin:auto;width:65px;height:65px;background:'+j.color+'">'+j.logo+'</div><h2>'+j.title+'</h2><p class="muted">'+j.company+'</p><p class="muted">⌖ '+j.city+'　 ·　'+j.type+'</p><h3 style="color:#0864ed">'+j.salary+'</h3></div><hr style="border:0;border-top:1px solid #edf0f5"><h3>Deskripsi Pekerjaan</h3><p style="font-size:13px;line-height:1.8;color:#66758b">'+j.desc+'</p><h3>Kualifikasi</h3><p style="font-size:13px;line-height:1.9;color:#66758b">✓ Pengalaman yang relevan<br>✓ Mampu bekerja sama dalam tim<br>✓ Komunikasi yang baik<br>✓ Bersedia ditempatkan di Indonesia</p><button class="primary" onclick="applyJob('+j.id+')">'+(applied.includes(j.id)?"Sudah Dilamar":"Lamar Sekarang")+'</button>';
}else if(page==="applications"){let list=jobs.filter(j=>applied.includes(j.id));v.innerHTML='<h2 class="page-title">Lamaran Saya</h2><p class="muted">Pantau status lamaran pekerjaan kamu.</p>'+(list.length?list.map(j=>jobCard(j)+'<p class="tag">Diproses</p>').join(""):'<div class="empty"><h3>Belum ada lamaran</h3>Lowongan yang kamu lamar akan muncul di sini.<br><br><button class="primary" onclick="go(\\'search\\')">Cari Pekerjaan</button></div>');
}else if(page==="profile"){v.innerHTML='<h2 class="page-title">Profil Saya</h2><div class="profile"><div class="avatar">'+(user?user.name.slice(0,2).toUpperCase():"AR")+'</div><div><b>'+(user?user.name:"Ahmad Rizki")+'</b><p class="muted">'+(user?user.email:"Masuk untuk menyimpan profil")+'</p></div></div>'+["Edit Profil","CV Saya","Notifikasi","Pengaturan"].map((s,i)=>'<button class="menuitem" onclick="go('+JSON.stringify(["edit","cv","notifications","settings"][i])+')">'+s+' <span>›</span></button>').join("")+'<button class="primary" onclick="go(\\'login\\')">'+(user?"Ganti Akun":"Masuk / Daftar")+'</button>';
}else if(page==="login"){v.innerHTML='<button class="back" onclick="go(\\'profile\\')">← Kembali</button>'+brand()+'<h2 class="page-title">Selamat Datang Kembali!</h2><p class="muted">Masuk atau buat akun KITA.</p><label class="field">Nama Lengkap<input id="name" placeholder="Nama lengkap"></label><label class="field">Email<input id="email" type="email" placeholder="Email kamu"></label><label class="field">Kata Sandi<input id="password" type="password" placeholder="Kata sandi"></label><button class="primary" onclick="register()">Masuk / Daftar</button><p class="muted">Demo: data profil disimpan di browser ini. Login produksi perlu backend aman.</p>';
}else if(page==="edit"){v.innerHTML='<button class="back" onclick="go(\\'profile\\')">← Kembali</button><h2 class="page-title">Edit Profil</h2><label class="field">Nama<input id="editname" value="'+(user?user.name:"Ahmad Rizki")+'"></label><label class="field">Email<input id="editemail" value="'+(user?user.email:"")+'"></label><button class="primary" onclick="saveProfile()">Simpan</button>';
}else if(page==="cv"){v.innerHTML='<button class="back" onclick="go(\\'profile\\')">← Kembali</button><h2 class="page-title">Unggah CV Anda</h2><p class="muted">Gunakan file PDF, DOC, atau DOCX.</p><label class="field">Pilih File<input type="file" accept=".pdf,.doc,.docx" onchange="toast(\\'File dipilih. Upload permanen perlu backend.\\')"></label>';
}else if(page==="notifications"){v.innerHTML='<button class="back" onclick="go(\\'profile\\')">← Kembali</button><h2 class="page-title">Notifikasi</h2><div class="job">🟢　Lamaran kamu sedang diproses</div><div class="job">🔵　Temukan lowongan baru untuk kamu</div><div class="job">🟠　Lengkapi profil dan CV kamu</div>';
}else if(page==="settings"){v.innerHTML='<button class="back" onclick="go(\\'profile\\')">← Kembali</button><h2 class="page-title">Pengaturan</h2><button class="menuitem" onclick="toast(\\'Bahasa Indonesia dipilih\\')">Bahasa　›</button><button class="menuitem" onclick="toast(\\'KITA versi demo 1.0\\')">Tentang Aplikasi　›</button><button class="menuitem" onclick="localStorage.clear();user=null;toast(\\'Data demo lokal dihapus\\');go(\\'home\\')">Hapus data demo　›</button>}}
function detail(id){currentJob=jobs.find(j=>j.id===id);page="detail";render()}
function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem("kk_saved",JSON.stringify(saved));render();toast("Daftar tersimpan diperbarui")}
function applyJob(id){if(!user){toast("Silakan masuk terlebih dahulu");go("login");return}if(!applied.includes(id))applied.push(id);localStorage.setItem("kk_applied",JSON.stringify(applied));render();toast("Lamaran demo berhasil disimpan")}
function register(){let name=$("name").value.trim(),email=$("email").value.trim(),password=$("password").value;if(!name||!email||!password){toast("Lengkapi semua kolom");return}user={name,email};localStorage.setItem("kk_user",JSON.stringify(user));toast("Profil demo dibuat");go("profile")}
function saveProfile(){user={name:$("editname").value,email:$("editemail").value};localStorage.setItem("kk_user",JSON.stringify(user));toast("Profil disimpan di browser");go("profile")}
render();
</script></body></html>
