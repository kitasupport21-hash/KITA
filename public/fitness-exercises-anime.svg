<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 900" role="img" aria-label="Anime girl demonstrating ten home exercises">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fff7ed"/><stop offset=".5" stop-color="#f8f5ff"/><stop offset="1" stop-color="#eef8ff"/></linearGradient><linearGradient id="shirt" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#f97316"/></linearGradient><linearGradient id="leg" x1="0" x2="1"><stop stop-color="#312e81"/><stop offset="1" stop-color="#4c1d95"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter></defs>
<rect width="2000" height="900" rx="50" fill="url(#bg)"/>
<g opacity=".18" fill="#94a3b8"><circle cx="180" cy="130" r="80"/><circle cx="1800" cy="150" r="110"/><circle cx="1030" cy="760" r="130"/></g>
<!-- reusable anime girl: head/hair/body/limbs -->
<g id="girl"><ellipse cx="100" cy="350" rx="90" ry="20" fill="#64748b" opacity=".18" filter="url(#shadow)"/><circle cx="100" cy="92" r="48" fill="#ffd7c2"/><path d="M55 90Q48 22 105 25Q160 25 148 105L126 85L112 115L91 86L70 113Z" fill="#3b2a2a"/><circle cx="83" cy="92" r="4" fill="#111827"/><circle cx="119" cy="92" r="4" fill="#111827"/><path d="M91 111Q100 117 109 111" fill="none" stroke="#b45353" stroke-width="3" stroke-linecap="round"/><path d="M63 142Q100 122 137 142L126 205L74 205Z" fill="url(#shirt)"/><path d="M72 195L45 285L75 292L96 220Z" fill="url(#leg)"/><path d="M128 195L155 285L125 292L104 220Z" fill="url(#leg)"/><path d="M63 150L30 225" stroke="#ffd7c2" stroke-width="22" stroke-linecap="round"/><path d="M137 150L170 225" stroke="#ffd7c2" stroke-width="22" stroke-linecap="round"/><path d="M34 225L20 292" stroke="#ffd7c2" stroke-width="18" stroke-linecap="round"/><path d="M166 225L180 292" stroke="#ffd7c2" stroke-width="18" stroke-linecap="round"/><path d="M4 304Q24 288 45 304L40 321Q20 326 0 319Z" fill="#fff"/><path d="M135 304Q160 288 180 304L184 319Q160 326 140 321Z" fill="#fff"/></g>
<!-- 1 high knees --> <g transform="translate(90 120)"><use href="#girl"/><path d="M74 195L35 255L82 245" fill="none" stroke="#4c1d95" stroke-width="30" stroke-linecap="round"/><path d="M126 195L165 255L118 245" fill="none" stroke="#4c1d95" stroke-width="30" stroke-linecap="round"/></g>
<!-- 2 jumping jacks --> <g transform="translate(470 120)"><use href="#girl"/><path d="M75 195L20 260" stroke="#4c1d95" stroke-width="30" stroke-linecap="round"/><path d="M125 195L180 260" stroke="#4c1d95" stroke-width="30" stroke-linecap="round"/><path d="M30 220L-5 165M170 220L205 165" stroke="#ffd7c2" stroke-width="20" stroke-linecap="round"/></g>
<!-- 3 squat --> <g transform="translate(850 120)"><use href="#girl"/><path d="M72 195L38 235L70 270M128 195L162 235L130 270" fill="none" stroke="#4c1d95" stroke-width="30" stroke-linecap="round"/><path d="M55 175H145" stroke="#ffd7c2" stroke-width="18" stroke-linecap="round"/></g>
<!-- 4 pushup --> <g transform="translate(1230 120) rotate(-5 100 180)"><use href="#girl"/><path d="M65 190L120 255L185 260" fill="none" stroke="#4c1d95" stroke-width="30" stroke-linecap="round"/><path d="M50 170L20 240" stroke="#ffd7c2" stroke-width="18" stroke-linecap="round"/></g>
<!-- 5 burpee --> <g transform="translate(1610 120) rotate(-12 100 180)"><use href="#girl"/><path d="M70 195L25 255L75 285M130 195L175 255L125 285" fill="none" stroke="#4c1d95" stroke-width="28" stroke-linecap="round"/><path d="M45 175L5 235M155 175L195 235" stroke="#ffd7c2" stroke-width="18" stroke-linecap="round"/></g>
<!-- 6 mountain climber --> <g transform="translate(280 500) rotate(4 100 150)"><use href="#girl"/><path d="M65 190L20 260L105 250M135 190L180 260L95 250" fill="none" stroke="#4c1d95" stroke-width="28" stroke-linecap="round"/><path d="M70 155L25 225M130 155L175 225" stroke="#ffd7c2" stroke-width="18" stroke-linecap="round"/></g>
<!-- 7 plank --> <g transform="translate(660 500) rotate(5 100 150)"><use href="#girl"/><path d="M65 205L20 270M135 205L180 270M40 270H160" fill="none" stroke="#4c1d95" stroke-width="28" stroke-linecap="round"/><path d="M65 170L25 235M135 170L175 235" stroke="#ffd7c2" stroke-width="18" stroke-linecap="round"/></g>
<!-- 8 jump rope --> <g transform="translate(1040 500)"><use href="#girl"/><path d="M20 300Q100 40 180 300" fill="none" stroke="#94a3b8" stroke-width="7"/><path d="M75 195L55 275M125 195L145 275" stroke="#4c1d95" stroke-width="28" stroke-linecap="round"/></g>
<!-- 9 glute bridge --> <g transform="translate(1400 500) rotate(-5 100 180)"><use href="#girl"/><path d="M70 205L40 255L100 230L160 255L130 205" fill="none" stroke="#4c1d95" stroke-width="30" stroke-linecap="round"/><path d="M60 165L15 235M140 165L185 235" stroke="#ffd7c2" stroke-width="18" stroke-linecap="round"/></g>
<!-- 10 step-up --> <g transform="translate(1760 500)"><rect x="45" y="275" width="110" height="55" rx="12" fill="#64748b" opacity=".35"/><use href="#girl"/><path d="M75 195L60 260L115 270M125 195L165 260" fill="none" stroke="#4c1d95" stroke-width="30" stroke-linecap="round"/></g>
</svg>